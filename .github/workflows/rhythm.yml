
name: Rhythm APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'upload/*.zip'
      - '.github/workflows/rhythm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import pathlib
          import stat
          import zipfile

          files = sorted(glob.glob("upload/*.zip"))
          if not files:
              print("No ZIP found. Using repository files.")
          else:
              file = files[-1]
              print("Extracting:", file)
              with zipfile.ZipFile(file) as z:
                  for item in z.infolist():
                      name = item.filename
                      p = pathlib.PurePosixPath(name)
                      mode = item.external_attr >> 16
                      if (
                          p.is_absolute()
                          or ".." in p.parts
                          or "\\" in name
                          or (p.parts and p.parts[0] == ".github")
                          or stat.S_ISLNK(mode)
                      ):
                          raise RuntimeError("Unsafe ZIP entry")
                  z.extractall(".")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip

          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        shell: bash
        run: |
          echo "Checking project..."
          ls -la

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
