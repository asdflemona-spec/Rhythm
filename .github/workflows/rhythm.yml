
name: Rhythm APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'upload/*.zip'
      - '.github/workflows/rhythm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip game
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import pathlib
          import stat
          import zipfile

          files = sorted(glob.glob("upload/*.zip"))
          if files:
              print("Extracting:", files[-1])
              with zipfile.ZipFile(files[-1]) as z:
                  for item in z.infolist():
                      name = item.filename
                      p = pathlib.PurePosixPath(name)
                      mode = item.external_attr >> 16
                      if (
                          p.is_absolute()
                          or ".." in p.parts
                          or "\\" in name
                          or p.parts[0] == ".github"
                          or stat.S_ISLNK(mode)
                      ):
                          raise RuntimeError("Unsafe ZIP entry")
                  z.extractall(".")
          else:
              print("No ZIP found. Using repository files.")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project
        run: |
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app

      - name: Build APK
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
